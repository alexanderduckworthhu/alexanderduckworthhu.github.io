name: Keep Streamlit demos awake

on:
  schedule:
    # Every 6 hours — Streamlit Community Cloud sleeps after ~12h of inactivity.
    - cron: "0 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Wake Streamlit apps
        run: python scripts/keep_streamlit_awake.py
